name: ci
# Runs only when asked, or from release.yml, so a push spends no private-repository minutes.
# The public export adds push and pull_request triggers, since public repositories have free runners.
on:
  workflow_call:
    inputs:
      repeat_phone:
        description: Repeat the phone end-to-end spec this many times, each in a fresh Firebase emulator (0 = not at all)
        type: number
        default: 0
  workflow_dispatch:
  push:
  pull_request:
    inputs:
      repeat_phone:
        description: Repeat the phone end-to-end spec this many times, each in a fresh Firebase emulator, to look for intermittent failures (0 = not at all)
        type: number
        default: 0
permissions:
  contents: read
env:
  PLAYWRIGHT_BROWSERS_PATH: .pw-browsers
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - name: Unit, integration, MCP and pty tests
        run: pnpm test
      - name: Clean install and CLI smoke
        shell: bash
        run: node scripts/smoke.mjs
      - name: Build website, as published, with the leak scan
        run: pnpm build:pages
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm exec playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.os }}
          path: test-results/
          retention-days: 7

  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:pages
      - run: pnpm exec playwright install --with-deps firefox webkit chromium
      - run: pnpm exec playwright test --project=firefox --project=webkit --project=mobile --project=android --project=iphone

  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # A demo- project id never reaches a real Firebase project. The values only identify it to the emulators.
      NEXT_PUBLIC_FIREBASE_CONFIG: '{"apiKey":"demo-key","authDomain":"demo-agentontrack.firebaseapp.com","projectId":"demo-agentontrack","appId":"demo-app"}'
      AOT_FIREBASE_EMULATORS: '1'
      AOT_CONFIGURED_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:pages
      - run: pnpm exec playwright install --with-deps chromium
      - name: Sign-in, saved data, feedback, delete and rules, against the Firebase emulators
        run: pnpm dlx firebase-tools@15 emulators:exec --only auth,firestore --project demo-agentontrack "pnpm exec playwright test accounts.spec accounts-configured.spec early-access-emulator.spec rules.spec phone.spec phone-new-session.spec --project=chromium --workers=1"
      - name: No emulator test may be silently skipped
        run: |
          node -e "const r=require('./test-results/e2e.json');const n=r.stats.skipped+r.stats.unexpected;console.log(JSON.stringify(r.stats));if(r.stats.skipped>0||r.stats.expected<20){console.error('skipped or too few tests ran');process.exit(1)}"
      - name: Repeat the phone spec, each time in a fresh emulator, to look for intermittent failures (only when asked)
        if: ${{ inputs.repeat_phone > 0 }}
        env:
          REPEATS: ${{ inputs.repeat_phone }}
        run: node scripts/repeat-phone-spec.mjs "$REPEATS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-accounts
          path: |
            test-results/
            test-results-repeat/
          retention-days: 14

  vscode:
    # A real VS Code, downloaded on this disposable runner, runs the extension against a real companion.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --dir packages/vscode run package
      - name: Extension host, loaded from source
        timeout-minutes: 6
        run: xvfb-run -a node packages/vscode/test/host/run.mjs
      - name: Extension host, the packaged VSIX installed with VS Code's own CLI
        timeout-minutes: 6
        run: AOT_HOST_MODE=vsix AOT_VSIX=dist-release/agentontrack-vscode.vsix xvfb-run -a node packages/vscode/test/host/run.mjs
      - name: Extension host, an untrusted workspace
        timeout-minutes: 6
        run: AOT_HOST_MODE=untrusted xvfb-run -a node packages/vscode/test/host/run.mjs

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (production)
        run: pnpm audit --prod --audit-level high
      - name: Licence check
        run: node scripts/check-licenses.mjs
      - name: Secret scan of tracked files
        run: node scripts/scan-secrets.mjs
