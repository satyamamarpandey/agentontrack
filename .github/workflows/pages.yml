name: pages
# Tests the site built from this source, deploys it to GitHub Pages, then checks the public address.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
env:
  PLAYWRIGHT_BROWSERS_PATH: .pw-browsers
  NEXT_PUBLIC_RELEASE_PUBLISHED: '1'
  NEXT_PUBLIC_RELEASE_VERSION: 1.0.0-rc.4
  # Optional accounts: unset builds a site with none. See docs/accounts-setup.md.
  NEXT_PUBLIC_FIREBASE_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG }}
  NEXT_PUBLIC_APPCHECK_SITE_KEY: ${{ vars.APPCHECK_SITE_KEY }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:pages
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project=chromium site.spec
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the public address and install scripts
        run: |
          sleep 20
          for p in '' install/ dashboard/ install.sh install.ps1; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' "https://pandeysatyam.com/agentontrack/$p")
            echo "$p: $code"
            [ "$code" = 200 ] || exit 1
          done
