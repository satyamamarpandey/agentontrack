name: provider-checks
# Real agent programs with a scripted model, in disposable runners, with no credentials of any kind.
on:
  push:
    branches: [integrations]
  workflow_dispatch:
    inputs:
      hosts:
        description: JSON list, so a repair reruns only what it affects
        default: '["hermes-mcp","opencode-v2"]'
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        which: ${{ fromJSON(inputs.hosts || '["hermes-mcp","opencode-v2"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b packages/cli
      - name: Install the real host
        env:
          WHICH: ${{ matrix.which }}
        run: |
          case "${WHICH%-mcp}" in
            hermes)
              curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash -s -- --skip-setup || true
              echo "$HOME/.local/bin" >> "$GITHUB_PATH"
              # MCP support is an optional extra of Hermes.
              (cd "$HOME/.hermes/hermes-agent" && (uv pip install --python venv/bin/python mcp || venv/bin/python -m pip install mcp)) || true
              ;;
            opencode-v2)
              curl -fsSL https://opencode.ai/install | bash -s -- --version 2.2.5 || true
              echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
              ;;
            copilot) npm install -g @github/copilot ;;
            gemini) npm install -g @google/gemini-cli ;;
            opencode) npm install -g opencode-ai ;;
            cline) npm install -g cline ;;
            continue) npm install -g @continuedev/cli ;;
          esac
      - run: node benchmarks/live/provider-checks.mjs ${{ matrix.which }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-${{ matrix.which }}
          path: runtime-results/
          retention-days: 30

  local-models:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.hosts == 'with-models' }}
    # Bounded: small real models on a CPU-only runner, each server with its own time limit. Results are kept even if one runs out of time.
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GGUF: https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b packages/cli
      - run: npm install -g opencode-ai
      - name: Ollama
        continue-on-error: true
        timeout-minutes: 10
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl set-property ollama MemoryMax=6G || true
          sleep 3
          ollama pull qwen2.5:3b
          printf 'FROM qwen2.5:3b\nPARAMETER num_ctx 16384\n' > /tmp/Modelfile
          ollama create aot:latest -f /tmp/Modelfile
          node benchmarks/live/local-model-checks.mjs ollama http://127.0.0.1:11434/v1 aot:latest
          sudo systemctl stop ollama
      - name: llama.cpp
        continue-on-error: true
        timeout-minutes: 16
        run: |
          mkdir -p /tmp/llama && cd /tmp/llama
          curl -fsSL -o m.gguf "$GGUF"
          git clone -q --depth 1 https://github.com/ggml-org/llama.cpp src
          cmake -S src -B build -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_TESTS=OFF > /dev/null
          cmake --build build -j4 --target llama-server > /dev/null
          S=build/bin/llama-server
          (LD_LIBRARY_PATH=$(dirname "$S") nohup "$S" -m m.gguf --port 8181 --jinja -c 16384 > /tmp/llama.log 2>&1 &)
          sleep 15
          cd "$GITHUB_WORKSPACE"
          node benchmarks/live/local-model-checks.mjs llamacpp http://127.0.0.1:8181/v1 m.gguf
          pkill llama-server || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: LM Studio
        continue-on-error: true
        timeout-minutes: 12
        run: |
          curl -fsSL https://lmstudio.ai/install.sh | bash
          export PATH="$HOME/.lmstudio/bin:$PATH"
          lms daemon up || true
          lms get "$GGUF" --yes
          lms load qwen2.5-3b-instruct --context-length 16384 --identifier aot --yes || lms ls
          lms server start --port 1234
          node benchmarks/live/local-model-checks.mjs lmstudio http://127.0.0.1:1234/v1 aot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-models
          path: runtime-results/
          retention-days: 30

  vendor:
    # Real agents on their own hosted models. Each needs a key the owner adds as a repository secret. With none, the result is BLOCKED.
    strategy:
      fail-fast: false
      matrix:
        which: [cursor, devin, kiro, perplexity]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b packages/cli
      - name: Install the real host, only if its key exists
        env:
          WHICH: ${{ matrix.which }}
          HAS: ${{ (matrix.which == 'cursor' && secrets.CURSOR_API_KEY != '') || (matrix.which == 'devin' && secrets.WINDSURF_API_KEY != '') || (matrix.which == 'kiro' && secrets.KIRO_API_KEY != '') }}
        run: |
          if [ "$HAS" != true ]; then exit 0; fi
          case "$WHICH" in
            cursor) curl https://cursor.com/install -fsS | bash; echo "$HOME/.local/bin" >> "$GITHUB_PATH" ;;
            devin) curl -fsSL https://cli.devin.ai/install.sh | bash; echo "$HOME/.local/bin" >> "$GITHUB_PATH" ;;
            kiro) curl -fsSL https://cli.kiro.dev/install | bash; echo "$HOME/.local/bin" >> "$GITHUB_PATH" ;;
          esac
      - run: node benchmarks/live/vendor-checks.mjs ${{ matrix.which }}
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          WINDSURF_API_KEY: ${{ secrets.WINDSURF_API_KEY }}
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vendor-${{ matrix.which }}
          path: runtime-results/
          retention-days: 30
