name: public-install
# A stranger's first run: the published commands, on a clean runner, with no checkout and no token.
# It installs the EXACT version that was just published, not "latest": a pre-release is never "latest", so an unpinned install would test an older
# release and could pass for the wrong build. It also fails unless the installed program reports that version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to install and test, for example 1.0.0-rc.5
        required: true
  release:
    types: [published]
permissions: {}
env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Install from the public site, then use it
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$' || { echo "not a version: $VERSION"; exit 1; }
          curl -fsSL https://pandeysatyam.com/agentontrack/install.sh | sh -s -- --version "$VERSION"
          export PATH="$HOME/.agentontrack/app/bin:$PATH"
          agentontrack --version | tee v.txt
          grep -Fq -- "$VERSION" v.txt || { echo "installed program does not report $VERSION"; exit 1; }
          mkdir p && cd p && git init -q
          agentontrack setup --yes
          agentontrack doctor --json > d.json
          node -e "const d=require('./d.json');if(!d.integrity.ok)process.exit(1);console.log(d.version,d.node)" 2>/dev/null || grep -q '"ok": true' d.json
          agentontrack install claude-code
          echo '{"session_id":"s","hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"agentontrack approve x"}}' | sh -c "$(grep -o '"command": "[^,]*hook claude-code' .claude/settings.local.json | head -1 | sed 's/"command": "//; s/\\"/"/g')" | grep -q '"permissionDecision":"deny"'
          agentontrack self uninstall
      - name: Install from the public site, then use it
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$') { Write-Host "not a version: $version"; exit 1 }
          $env:AOT_VERSION = $version
          irm https://pandeysatyam.com/agentontrack/install.ps1 | iex
          $b = Join-Path $HOME '.agentontrack\app\bin\agentontrack.cmd'
          $reported = & $b --version | Out-String
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not $reported.Contains($version)) { Write-Host "installed program does not report $version"; exit 1 }
          New-Item -ItemType Directory p | Out-Null; Set-Location p; git init -q
          & $b setup --yes
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $b doctor --json | Out-String | Select-String '"ok": true' | Out-Null
          if (-not $?) { exit 1 }
          & $b install claude-code
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $b self uninstall
          exit 0
