name: release
# Tag v* or run by hand. Tests, builds, proves a clean install on each OS, then leaves a DRAFT release.
# A draft is visible to the repository's owner only: publishing it is the owner's decision.
on:
  workflow_dispatch:
    inputs:
      skip_ci:
        description: Skip the full test matrix, for a repair that does not need it
        type: boolean
        default: false
      oses:
        description: JSON list of clean-install runners
        default: '["ubuntu-latest","ubuntu-24.04-arm","macos-latest","macos-15-intel","windows-latest"]'
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    if: ${{ !inputs.skip_ci }}
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: node scripts/check-licenses.mjs
      - run: node scripts/scan-secrets.mjs
      - run: pnpm build
      - run: node scripts/release/package.mjs
      - name: Build provenance
        # GitHub offers attestations on public repositories. On a private one this records why there is none.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist-release/*
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist-release/
            scripts/release/clean-install-test.mjs
            scripts/release/pty-helper.mjs
          retention-days: 30

  clean-install:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.oses || '["ubuntu-latest","ubuntu-24.04-arm","macos-latest","macos-15-intel","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # No checkout, and no token passed on: the release files are all this job has, as with a stranger's machine.
      - uses: actions/download-artifact@v5
        with:
          name: release
      - name: Install test harness only
        shell: bash
        run: npm install --no-save --silent @lydell/node-pty@1.2.0-beta.18
      - run: node scripts/release/clean-install-test.mjs dist-release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-install-${{ matrix.os }}
          path: clean-install-*.json

  draft:
    needs: clean-install
    if: ${{ !cancelled() && needs.clean-install.result == 'success' && startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: release
      - name: Create a draft release, for the owner to review and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist-release/* --draft --prerelease --title "AgentOnTrack $GITHUB_REF_NAME" --notes-file docs/release/NOTES.md
